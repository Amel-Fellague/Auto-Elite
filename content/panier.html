<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Commande — AutoElite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/panier.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">AutoElite</a>
            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false"></button>
            <ul class="nav-links">
                <li><a href="../index.html">Accueil</a></li>
                <li><a href="produit.html">Nos Voitures</a></li>
                <li><a href="panier.html" class="active">Commande</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Ma Commande</h1>
        <p class="page-subtitle" id="cart-count-label">Chargement...</p>

        <div class="cart-layout">
            <div class="cart-items-section" id="cart-items-section"></div>

            <aside class="cart-summary">
                <div class="summary-title">Récapitulatif</div>
                <div class="summary-row">
                    <span>Véhicules</span>
                    <span id="item-count">0</span>
                </div>
                <div class="summary-row">
                    <span>Sous-total</span>
                    <span id="subtotal">0 €</span>
                </div>
                <div class="summary-row">
                    <span>Livraison</span>
                    <span style="color:var(--gold)">Gratuite</span>
                </div>
                <div class="summary-row total">
                    <span>Total TTC</span>
                    <span id="total">0 €</span>
                </div>
                <button class="checkout-btn" id="checkout-btn">Passer la commande →</button>
                <button class="clear-btn" id="clear-cart-btn">Vider la commande</button>
                <a href="produit.html" class="continue-link">← Continuer mes achats</a>
            </aside>
        </div>
    </main>

    <footer>
        <p style="text-align:center; padding:2rem; color:var(--text-muted); font-size:.82rem; border-top:1px solid var(--border);">
            &copy; 2026 <strong style="color:var(--gold)">AutoElite</strong> — Tous droits réservés
        </p>
    </footer>

    <div class="toast" id="toast"></div>
    <script src="../javascript/nav-toggle.js"></script>
    <script src="../javascript/panier.js"></script>
</body>
</html>
